name: Android debug build
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools are missing at $SDK" >&2
            ls -la /usr/local/lib/android /opt/android-sdk 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDKMANAGER" --licenses || true
          "$ANDROID_SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon test
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TASKD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Attach APK to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
