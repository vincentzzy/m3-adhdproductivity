name: Android debug build
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools are missing at $SDK" >&2
            ls -la /usr/local/lib/android /opt/android-sdk 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDKMANAGER" --licenses || true
          set +e
          "$ANDROID_SDKMANAGER" --list > sdk-list.log 2>&1
          grep -E 'platforms;android-36|build-tools;36|platform-tools' sdk-list.log | tail -n 20
          "$ANDROID_SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > sdk-install.log 2>&1
          result=$?
          tail -n 25 sdk-install.log
          if [ "$result" -ne 0 ]; then
            grep -Ei 'not found|failed|error|exception|warning|package path|could not|unable' sdk-install.log | tail -n 15 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$result"
          fi
      - name: Build debug APK
        id: assemble
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug > build.log 2>&1
          result=$?
          tail -n 30 build.log
          if [ "$result" -ne 0 ]; then
            grep -Ei 'What went wrong|Execution failed|Could not resolve|Could not find|No matching variant|Could not GET|status code|UnknownHost|PKIX|failed to|FAILURE:' build.log | tail -n 20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 8 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$result"
          fi
      - name: Run unit tests
        run: |
          set +e
          ./gradlew --no-daemon test > test.log 2>&1
          result=$?
          tail -n 30 test.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 30 test.log)
            exit "$result"
          fi
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TASKD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Attach APK to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
