name: versions
on: push
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe artifact public API
        run: |
          bash ci/probe.sh || true
          tail -c 6000 /tmp/probe-report.txt
      - name: Report
        if: always()
        env:
          CI_REPORT_TITLE: probe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: CI_REPORT_TITLE=probe bash ci/report.sh /tmp/probe-report.txt
