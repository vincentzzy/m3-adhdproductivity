name: sdkcheck
on: push
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: List installed and installable SDK packages
        run: |
          OUT=/tmp/sdk.txt; : > $OUT
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> $OUT
          ls "$SDK/platforms" >> $OUT 2>&1
          ls "$SDK/build-tools" >> $OUT 2>&1
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "SDKMANAGER=$SM" >> $OUT
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --list 2>/dev/null | grep -E "^\s+(platforms;android-3[5-9]|build-tools;3[5-9])" | sort -u | head -30 >> $OUT
          tail -40 $OUT
      - name: Report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: CI_REPORT_TITLE=sdk bash ci/report.sh /tmp/sdk.txt
